
name: Build TopMinded APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TopMinded_AI_Manager_Source_v2.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir source
          unzip -o TopMinded_AI_Manager_Source_v2.zip -d source

      - name: Build APK
        run: gradle -p source/android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TopMinded-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
