name: Build TopMinded APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TopMinded_AI_Manager_Source_v2.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK yo'lini sozlash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: SDK manager topish
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager topilmadi"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          echo "Topildi: $SDKMANAGER"

      - name: Litsenziyalarni qabul qilish
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Android paketlarini o'rnatish
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: ZIPni tekshirish
        run: |
          ls -lh
          test -f TopMinded_AI_Manager_Source_v2.zip

      - name: ZIPni ochish
        run: |
          mkdir -p source
          unzip -o TopMinded_AI_Manager_Source_v2.zip -d source

      - name: Android loyihasini topish
        run: |
          FILE=$(find source -name settings.gradle \
            -o -name settings.gradle.kts | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Android loyiha topilmadi"
            find source -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Loyiha: $DIR"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK qurish
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: APK mavjudligini tekshirish
        run: |
          find source -name "*.apk"
          test -n "$(find source -name '*.apk')"

      - name: APKni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TopMinded-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error