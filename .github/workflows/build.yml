name: Build TopMinded APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TopMinded_AI_Manager_Source_v2.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK sozlash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: SDK litsenziyalarini qabul qilish
        run: |
          yes | sdkmanager --licenses || true

      - name: Kerakli Android paketlarini o'rnatish
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source ZIPni ochish
        run: |
          mkdir -p source
          unzip -o TopMinded_AI_Manager_Source_v2.zip -d source

      - name: APK qurish
        run: |
          gradle -p source/android assembleDebug

      - name: APKni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TopMinded-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
