
name: Build TopMinded APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TopMinded_AI_Manager_Source_v2.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir -p source
          unzip -o TopMinded_AI_Manager_Source_v2.zip -d source

      - name: Check Android project
        run: |
          ls -la source
          ls -la source/android

      - name: Build APK
        run: gradle -p source/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TopMinded-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
