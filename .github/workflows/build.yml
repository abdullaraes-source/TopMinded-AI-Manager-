name: Build TopMinded APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TopMinded_AI_Manager_Source_v2.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK sozlash
        uses: android-actions/setup-android@v3

      - name: Android litsenziyalarini qabul qilish
        run: |
          yes | sdkmanager --licenses || true

      - name: Android SDK paketlarini o'rnatish
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "platforms;android-36"

      - name: ZIP faylni tekshirish
        run: |
          test -f TopMinded_AI_Manager_Source_v2.zip

      - name: Source fayllarni ochish
        run: |
          mkdir -p source
          unzip -o TopMinded_AI_Manager_Source_v2.zip -d source

      - name: Android loyiha joyini topish
        run: |
          PROJECT=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "settings.gradle topilmadi!"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Loyiha joyi: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Gradle versiyasini sozlash
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK qurish
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: APK faylini tekshirish
        run: |
          find source -type f -name "*.apk"

      - name: APKni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TopMinded-APK
          path: |
            source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
